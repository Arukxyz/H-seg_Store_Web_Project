<!-- Casaca acolchada (relleno), variante "-fill" para el badge "1 abrigo". Las costuras del
     acolchado y el cierre quedan caladas con una máscara interna. Se usa como máscara
     (.bi-casaca-fill en hoseg.css): el color real lo pone currentColor. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
    <defs>
        <mask id="costuras">
            <rect width="16" height="16" fill="#fff"/>
            <path d="M8 4.4v10.6M4.3 8.8h7.4M4.3 11.7h7.4" stroke="#000" stroke-width=".9" stroke-linecap="round"/>
        </mask>
    </defs>
    <path d="M5.8 1.5 3.2 2.4C2.3 2.7 1.8 3.3 1.7 4.2L.6 10.2l1.8.4 1.7-4.3v8.2h7.8V6.3l1.7 4.3 1.8-.4-1.1-6c-.1-.9-.6-1.5-1.5-1.8l-2.6-.9L8 3.6z"
          fill="#000" stroke="#000" stroke-width="1" stroke-linejoin="round" mask="url(#costuras)"/>
</svg>
