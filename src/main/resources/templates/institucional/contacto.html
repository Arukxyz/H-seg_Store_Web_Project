<!DOCTYPE html>
<!--
  Bloque 3 · 3.5 Contacto (GET/POST /contacto, ContactoController).
  Modelo:
    mensajeForm MensajeContactoForm (nombre, email, asunto, mensaje)
  Variante ?enviado: "Mensaje enviado" (se envía acuse de recibo por correo).
  Cabecera común (fragments/cabecera), formulario en tarjeta como Consulta tu impacto;
  estilos en static/css/contacto.css.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: pagina(titulo='Contacto · HÖSÉG', activa='',
                                          transparente=false, contenido=~{::main}, estilos=~{::link}, scripts=~{})}">
<head>
    <link rel="stylesheet" th:href="@{/css/contacto.css}">
</head>
<body>
<main class="hs-main--bajo-nav hs-pagina-contacto">
    <th:block th:replace="~{fragments/cabecera :: cabecera('Ayuda', 'Contacto',
        'Escríbenos por tu pedido, tu impacto o lo que necesites. Te respondemos por correo.')}"/>

    <section class="hs-seccion pt-0">
        <div class="container hs-ancho-form">
            <div class="alert alert-success d-flex align-items-center gap-2" role="status" th:if="${param.enviado}">
                <i class="bi bi-check-circle" aria-hidden="true"></i>
                <span>Recibimos tu mensaje. Te responderemos pronto.</span>
            </div>

            <form class="hs-contacto hs-entrada" style="--hs-i: 3" th:object="${mensajeForm}" method="post"
                  th:action="@{/contacto}">
                <div class="hs-contacto__campo">
                    <label class="hs-label" for="nombre">Nombre</label>
                    <input class="hs-input" th:field="*{nombre}" placeholder="Tu nombre" autocomplete="name">
                    <div class="hs-campo-error" th:errors="*{nombre}"></div>
                </div>
                <div class="hs-contacto__campo">
                    <label class="hs-label" for="email">Correo electrónico</label>
                    <input class="hs-input" type="email" th:field="*{email}" placeholder="tu@correo.com" autocomplete="email">
                    <div class="hs-campo-error" th:errors="*{email}"></div>
                </div>
                <div class="hs-contacto__campo">
                    <label class="hs-label" for="asunto">Asunto</label>
                    <input class="hs-input" th:field="*{asunto}" placeholder="¿Sobre qué nos escribes?">
                    <div class="hs-campo-error" th:errors="*{asunto}"></div>
                </div>
                <div class="hs-contacto__campo">
                    <label class="hs-label" for="mensaje">Mensaje</label>
                    <textarea class="hs-input" th:field="*{mensaje}" rows="5" placeholder="Cuéntanos"></textarea>
                    <div class="hs-campo-error" th:errors="*{mensaje}"></div>
                </div>
                <button class="hs-btn hs-btn--primario hs-brillo w-100" type="submit">
                    Enviar mensaje <i class="bi bi-arrow-right" aria-hidden="true"></i>
                </button>
            </form>

            <p class="hs-contacto__alternativa hs-entrada" style="--hs-i: 4">
                También puedes escribirnos a <a class="hs-enlace" href="mailto:hola@hoseg.pe">hola@hoseg.pe</a>.
            </p>
        </div>
    </section>
</main>
</body>
</html>
