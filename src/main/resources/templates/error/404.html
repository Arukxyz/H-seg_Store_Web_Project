<!DOCTYPE html>
<!--
  ESQUELETO · Bloque 5 · 3.7 Error 404. Spring Boot la muestra sola para cualquier ruta inexistente
  y cuando un servicio lanza RecursoNoEncontradoException (producto oculto, pedido ajeno…).

  Diseño: mismo tratamiento que error.html pero en salvia (hs-error__icono--salvia), coherente con el
  color que usa el resto del sitio para "naturaleza/calma" en vez de "urgencia".
  No se agregó ni se quitó ninguna variable del modelo, así que no afecta la lógica de los demás bloques.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/base :: pagina(titulo='Página no encontrada · HÖSÉG', activa='',
                                          transparente=false, contenido=~{::main}, estilos=~{::link}, scripts=~{::script})}">

<head>
    <link rel="stylesheet" th:href="@{/css/errores.css}">
</head>

<body>
    <main class="hs-main--bajo-nav">
        <section class="hs-seccion hs-error d-flex align-items-center hs-fondo-comunidad">
            <div class="container hs-ancho-sm text-center">
                <div class="hs-error__icono hs-error__icono--salvia hs-entrada" style="--hs-i: 0">
                    <i class="bi bi-signpost-split" aria-hidden="true"></i>
                </div>

                <p class="hs-kicker hs-entrada" style="--hs-i: 1">Error 404</p>
                <h1 class="hs-h2 mb-2 hs-entrada" style="--hs-i: 2">No encontramos esta página.</h1>
                <p class="hs-texto-secundario mb-2 hs-entrada" style="--hs-i: 3">
                    Puede que el enlace esté mal escrito, o que esta prenda ya haya encontrado otro hogar.
                </p>

                <div class="mb-2 hs-entrada" style="--hs-i: 4">
                    <div class="hs-barra-progreso mx-auto">
                        <div class="hs-barra-progreso__relleno hs-barra-progreso__relleno--salvia"></div>
                    </div>
                </div>
                <p class="hs-texto-secundario mb-4 hs-entrada" style="--hs-i: 4">
                    <small class="hs-error__aviso" id="hs-aviso-redireccion">
                        Serás redirigido al inicio en <span id="hs-segundos">8</span> segundos…
                    </small>
                </p>

                <div class="d-flex flex-column flex-sm-row justify-content-center gap-2 hs-entrada"
                    style="--hs-i: 5">
                    <a class="hs-btn hs-btn--primario" id="hs-link-inicio" th:href="@{/}">
                        <i class="bi bi-house me-1"></i> Ir al inicio
                    </a>
                    <a class="hs-btn hs-btn--secundario" th:href="@{/tienda}">
                        <i class="bi bi-bag me-1"></i> Ver la tienda
                    </a>
                </div>
            </div>
        </section>
    </main>
    <script th:inline="javascript">
        (function () {
            var segundosRestantes = 8;
            var etiqueta = document.getElementById('hs-segundos');
            var destino = document.getElementById('hs-link-inicio').href;

            var intervalo = setInterval(function () {
                segundosRestantes -= 1;
                if (segundosRestantes <= 0) {
                    clearInterval(intervalo);
                    window.location.href = destino;
                    return;
                }
                etiqueta.textContent = segundosRestantes;
            }, 1000);
        })();
    </script>
</body>

</html>
