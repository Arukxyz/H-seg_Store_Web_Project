<!DOCTYPE html>
<!--
  ESQUELETO · Bloque 2 · 2.1 Iniciar sesión (GET /login, AuthController; el POST lo procesa Spring Security).
  El formulario DEBE enviar los campos "email" y "password" por POST a /login (th:action añade el CSRF).
  Variantes por parámetro de la URL: ?error · ?bloqueado=5 (minutos) · ?registrado · ?restablecida
  Modelo:
    desdeCompra boolean: llegó desde "Confirmar compra" (aviso "tu carrito se conserva")
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: pagina(titulo='Iniciar sesión · HÖSÉG', activa='cuenta',
                                          transparente=false, contenido=~{::main}, estilos=~{}, scripts=~{})}">
<body>
<main class="hs-main--bajo-nav">
    <section class="hs-seccion">
        <div class="container hs-ancho-form">
            <h1 class="hs-h2 mb-3">Iniciar sesión</h1>
            <div class="alert alert-info" th:if="${desdeCompra}">Inicia sesión para confirmar; tu carrito se conserva.</div>
            <div class="alert alert-danger" th:if="${param.error}">Email o contraseña incorrectos.</div>
            <div class="alert alert-danger" th:if="${param.bloqueado}"
                 th:text="'Superaste los intentos permitidos. Intenta de nuevo en ' + ${param.bloqueado} + ' minuto(s).'">Bloqueado</div>
            <div class="alert alert-success" th:if="${param.registrado}">Tu cuenta está lista. Inicia sesión.</div>
            <div class="alert alert-success" th:if="${param.restablecida}">Cambiamos tu contraseña. Inicia sesión.</div>

            <form method="post" th:action="@{/login}">
                <label class="d-block">Email <input class="hs-input" type="email" name="email" autocomplete="email" required></label>
                <label class="d-block mt-2">Contraseña <input class="hs-input" type="password" name="password" autocomplete="current-password" required></label>
                <button class="hs-btn hs-btn--primario mt-3" type="submit">Ingresar</button>
            </form>
            <p class="mt-3"><a th:href="@{/recuperar}">¿Olvidaste tu contraseña?</a> · <a th:href="@{/registro}">Crear cuenta</a></p>
        </div>
    </section>
</main>
</body>
</html>
