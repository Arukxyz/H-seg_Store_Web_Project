<!DOCTYPE html>
<!--
  ESQUELETO · Bloque 2 · 2.3 Recuperar contraseña (GET/POST /recuperar, AuthController).
  POST con el campo "email". Variante ?enviado: el mensaje es el mismo exista o no el correo.
  Sin SMTP configurado, el enlace aparece en la consola del servidor (CorreoService).
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: pagina(titulo='Recuperar contraseña · HÖSÉG', activa='cuenta',
                                          transparente=false, contenido=~{::main}, estilos=~{}, scripts=~{})}">
<body>
<main class="hs-main--bajo-nav">
    <section class="hs-seccion">
        <div class="container hs-ancho-form">
            <h1 class="hs-h2 mb-3">Recuperar contraseña</h1>
            <p th:if="${param.enviado}">Si el correo está registrado, te enviamos un enlace para elegir una contraseña nueva.</p>
            <form th:unless="${param.enviado}" method="post" th:action="@{/recuperar}">
                <input class="hs-input" type="email" name="email" placeholder="tu@correo.com" required>
                <button class="hs-btn hs-btn--primario mt-2" type="submit">Enviar enlace</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
