<!DOCTYPE html>
<!--
  ESQUELETO · Bloque 1 · 1.5 Confirmar compra (GET/POST /carrito/confirmar, CarritoController).
  Exige sesión de cliente: sin sesión, Spring Security lleva a /login (con aviso desdeCompra).
  Modelo: lo mismo que el carrito (items, total, impacto, problemasPorCodigo, sePuedeConfirmar) y además
    envioForm     DatosEnvioForm, precargado con la cuenta (tipo, nombreReceptor, telefonoReceptor, direccion,
                  referencia, distrito, provincia, departamento). Error global: direccionCompleta.
    tiposEnvio    TipoEnvio[] (RECOJO_TIENDA, DELIVERY; etiqueta)
    costoDelivery BigDecimal (el recojo es gratis)
    localesRecojo List<LocalCafe> (dónde recoger)
  El total a pagar es total + envío; el costo lo calcula el servidor. Incluye "Instrucciones de pago".
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: pagina(titulo='Confirmar compra · HÖSÉG', activa='carrito',
                                          transparente=false, contenido=~{::main}, estilos=~{}, scripts=~{})}">
<body>
<main class="hs-main--bajo-nav">
    <th:block th:replace="~{fragments/avisos :: avisos}"/>
    <section class="hs-seccion">
        <div class="container">
            <h1 class="hs-h2 mb-3">Confirmar compra</h1>

            <ul>
                <li th:each="i : ${items}" th:text="${i.cantidad} + ' × ' + ${i.nombre} + ' (' + ${i.talla} + ')'">1 × Casaca (M)</li>
            </ul>
            <p th:text="'Productos: S/ ' + ${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}">Productos</p>
            <p th:if="${impacto.tieneImpacto()}" th:text="'Generas ' + ${impacto.texto}">Impacto</p>

            <form th:object="${envioForm}" method="post" th:action="@{/carrito/confirmar}" class="hs-ancho-form">
                <fieldset>
                    <legend class="h5">Entrega</legend>
                    <label th:each="t : ${tiposEnvio}" class="me-3">
                        <input type="radio" th:field="*{tipo}" th:value="${t}">
                        <span th:text="${t.etiqueta}">Recojo en tienda</span>
                        <small th:if="${t.name() == 'DELIVERY'}" th:text="'(S/ ' + ${#numbers.formatDecimal(costoDelivery, 1, 'COMMA', 2, 'POINT')} + ')'">(S/ 10.00)</small>
                    </label>
                    <p class="hs-texto-secundario" th:each="l : ${localesRecojo}" th:text="'Recojo: ' + ${l.nombre} + ', ' + ${l.direccion}">Recojo</p>
                </fieldset>

                <input class="hs-input mt-2" th:field="*{nombreReceptor}" placeholder="Quién recibe">
                <div class="text-danger" th:errors="*{nombreReceptor}"></div>
                <input class="hs-input mt-2" th:field="*{telefonoReceptor}" placeholder="Celular">
                <div class="text-danger" th:errors="*{telefonoReceptor}"></div>
                <input class="hs-input mt-2" th:field="*{direccion}" placeholder="Dirección (delivery)">
                <input class="hs-input mt-2" th:field="*{referencia}" placeholder="Referencia">
                <input class="hs-input mt-2" th:field="*{distrito}" placeholder="Distrito">
                <input class="hs-input mt-2" th:field="*{provincia}" placeholder="Provincia">
                <input class="hs-input mt-2" th:field="*{departamento}" placeholder="Departamento">
                <div class="text-danger" th:errors="*{direccionCompleta}"></div>

                <p class="mt-3"><strong>Instrucciones de pago:</strong> texto de ejemplo; el equipo define el medio (Yape, transferencia).</p>
                <button class="hs-btn hs-btn--primario" type="submit" th:disabled="${!sePuedeConfirmar}">Confirmar compra</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
