spring.application.name=hoseg-web
server.port=8080

# ---------- Base de datos compartida (Supabase, Session pooler puerto 5432) ----------
# Las credenciales nunca van en este archivo: se toman de variables de entorno
# (las mismas que usa el escritorio SEGITD-HOSEG) o de application-local.properties,
# que esta en .gitignore.
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=10000

# ---------- JPA ----------
# El esquema es fuente unica de verdad y vive en los scripts SQL versionados del
# escritorio (01_schema.sql .. 06_web_clientes.sql). Hibernate solo verifica que
# las entidades coincidan; NUNCA usar update/create, crearia tablas paralelas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8

# ---------- Sesion (carrito) ----------
server.servlet.session.timeout=60m

# ---------- Portal de consulta de impacto ----------
# Debe coincidir con portal.consulta.url del escritorio: el QR de cada boleta PDF
# apunta a <esta ruta>?donacion=<id>.
hoseg.consulta.ruta=/consulta-impacto

# ---------- Comprobantes ----------
# Secuencia creada por 06_web_clientes.sql; el codigo resultante es WEB-nnnnnn.
hoseg.comprobante.prefijo=WEB-
hoseg.comprobante.secuencia=seq_comprobante_web
